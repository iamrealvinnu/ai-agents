<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Agent</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      margin: 0;
      padding: 40px;
      transition: background 0.5s ease;
    }
    .light-mode {
      background: linear-gradient(180deg, #f3f4f6, #d1d5db);
      color: #0a1c3d;
    }
    .dark-mode {
      background: linear-gradient(180deg, #0a1c3d, #374151);
      color: #d1d5db;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      position: relative;
      z-index: 1;
    }
    .sidebar {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .sidebar h3 {
      font-size: 1.2em;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    .category {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .category:hover, .category.active {
      background: rgba(56, 189, 248, 0.2);
    }
    .main {
      padding: 20px;
    }
    h1 {
      font-size: 2.2em;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .suggestion {
      font-size: 0.9em;
      color: #f472b6;
      animation: typewriter 2s steps(30) forwards;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #f472b6;
    }
    .input-hub {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    input, select {
      padding: 12px;
      border: none;
      border-bottom: 2px solid #38bdf8;
      background: transparent;
      color: inherit;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-bottom: 2px solid #f472b6;
    }
    select {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #38bdf8, #f472b6);
      color: #fff;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }
    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }
    button:active::after {
      width: 200px;
      height: 200px;
      opacity: 0;
    }
    .task-list {
      margin-top: 20px;
    }
    .task-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: flipIn 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }
    .task-card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .task-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.1"><path d="M0 50 L50 0 L100 50" stroke="%2338bdf8" stroke-width="1" fill="none"/></svg>') repeat;
      opacity: 0.1;
    }
    .task-card.completed {
      background: rgba(0, 204, 0, 0.15);
      border-color: #00cc00;
    }
    .task-card.completed span {
      text-decoration: line-through;
      opacity: 0.7;
    }
    .task-info {
      flex-grow: 1;
    }
    .task-info small {
      display: block;
      color: #f472b6;
      font-size: 0.8em;
    }
    .task-actions button {
      padding: 8px 16px;
      margin-left: 10px;
      font-size: 0.9em;
    }
    .error {
      color: #f472b6;
      font-size: 0.9em;
      margin-top: 10px;
      opacity: 0;
      animation: fadeInError 0.5s ease forwards;
    }
    .data-stream {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .stream-line {
      position: absolute;
      width: 2px;
      height: 100px;
      background: #38bdf8;
      opacity: 0.3;
      animation: flow 5s infinite linear;
    }
    .stream-line:nth-child(1) { left: 20%; animation-delay: 0s; }
    .stream-line:nth-child(2) { left: 40%; animation-delay: 1s; }
    .stream-line:nth-child(3) { left: 60%; animation-delay: 2s; }
    .stream-line:nth-child(4) { left: 80%; animation-delay: 3s; }
    @keyframes flipIn {
      from { transform: perspective(1000px) rotateX(90deg); opacity: 0; }
      to { transform: perspective(1000px) rotateX(0); opacity: 1; }
    }
    @keyframes fadeInError {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes flow {
      0% { transform: translateY(100vh); opacity: 0.3; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-100vh); opacity: 0.3; }
    }
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>
</head>
<body class="dark-mode">
  <div class="data-stream">
    <div class="stream-line"></div>
    <div class="stream-line"></div>
    <div class="stream-line"></div>
    <div class="stream-line"></div>
  </div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TaskFlowApp = () => {
      const [tasks, setTasks] = useState([]);
      const [taskInput, setTaskInput] = useState('');
      const [urgency, setUrgency] = useState(1);
      const [category, setCategory] = useState('Work');
      const [error, setError] = useState('');
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'dark');
      const [sortBy, setSortBy] = useState('priority');
      let errorTimeout = null;

      // Persist theme
      useEffect(() => {
        document.body.className = theme + '-mode';
        localStorage.setItem('theme', theme);
      }, [theme]);

      // Automatically categorize tasks based on keywords
      const categorizeTask = (taskName) => {
        const lowerTask = taskName.toLowerCase();
        const workKeywords = ['client', 'meeting', 'project', 'code', 'email', 'work', 'demo', 'report', 'deadline'];
        const personalKeywords = ['gym', 'workout', 'family', 'friend', 'trip', 'shop', 'dinner', 'personal', 'hobby'];
        if (workKeywords.some(keyword => lowerTask.includes(keyword))) return 'Work';
        if (personalKeywords.some(keyword => lowerTask.includes(keyword))) return 'Personal';
        return 'Other';
      };

      // Add task with auto-categorization
      const addTask = () => {
        if (!taskInput.trim()) {
          clearTimeout(errorTimeout);
          setError('Please enter a task');
          errorTimeout = setTimeout(() => setError(''), 3000);
          return;
        }
        const priorityScore = urgency * 10;
        const estimatedTime = estimateTime(taskInput);
        const autoCategory = categorizeTask(taskInput);
        const newTask = {
          name: taskInput,
          priority: priorityScore,
          time: suggestTime(priorityScore),
          category: autoCategory,
          estimatedTime,
          completed: false,
          id: Date.now(),
          isAutoCategorized: true
        };
        if (detectConflict(newTask)) {
          clearTimeout(errorTimeout);
          setError('Warning: Schedule conflict detected');
          errorTimeout = setTimeout(() => setError(''), 3000);
        }
        setTasks([...tasks, newTask]);
        setTaskInput('');
        setUrgency(1);
        setCategory(autoCategory); // Update sidebar to reflect auto-category
      };

      // Estimate task duration (mock AI logic)
      const estimateTime = (taskName) => {
        const length = taskName.length;
        if (length > 20) return '2 hours';
        if (length > 10) return '1 hour';
        return '30 minutes';
      };

      // Suggest optimal time
      const suggestTime = (score) => {
        if (score >= 40) return 'Morning (9-11 AM)';
        if (score >= 20) return 'Afternoon (1-3 PM)';
        return 'Evening (4-6 PM)';
      };

      // Detect schedule conflicts (mock logic)
      const detectConflict = (newTask) => {
        return tasks.some(task => task.time === newTask.time && !task.completed);
      };

      // Delete task
      const deleteTask = (id) => {
        setTasks(tasks.filter(task => task.id !== id));
      };

      // Toggle task completion
      const toggleComplete = (id) => {
        setTasks(tasks.map(task =>
          task.id === id ? { ...task, completed: !task.completed } : task
        ));
      };

      // Clear all tasks
      const clearAll = () => {
        setTasks([]);
      };

      // Export tasks as JSON
      const exportTasks = () => {
        const data = JSON.stringify(tasks, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'taskflow-tasks.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      // Sort tasks
      const sortedTasks = [...tasks].sort((a, b) => {
        if (sortBy === 'priority') return b.priority - a.priority;
        if (sortBy === 'time') return a.time.localeCompare(b.time);
        return a.category.localeCompare(b.category);
      });

      // Toggle theme
      const toggleTheme = () => {
        setTheme(theme === 'dark' ? 'light' : 'dark');
      };

      // Smart suggestion
      const getSuggestion = () => {
        if (tasks.length === 0) return 'Start by adding a high-priority task!';
        if (tasks.some(task => task.priority >= 40)) return 'High-priority tasks are best tackled in the morning.';
        return 'Group tasks by category for better organization.';
      };

      return (
        <div className="container">
          <div className="sidebar">
            <h3>Categories</h3>
            {['Work', 'Personal', 'Other'].map(cat => (
              <div
                key={cat}
                className={`category ${category === cat ? 'active' : ''}`}
                onClick={() => setCategory(cat)}
                role="button"
                tabIndex={0}
                onKeyDown={(e) => e.key === 'Enter' && setCategory(cat)}
              >
                {cat}
              </div>
            ))}
          </div>
          <div className="main">
            <h1>TaskFlow Agent by NeuraX AI</h1>
            <div className="top-bar">
              <div className="suggestion">{getSuggestion()}</div>
              <button onClick={toggleTheme} aria-label={`Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`}>
                {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
              </button>
            </div>
            <div className="input-hub">
              <input
                type="text"
                value={taskInput}
                onChange={(e) => setTaskInput(e.target.value)}
                placeholder="Enter task or say it (e.g., Client call)"
                aria-label="Task input"
              />
              <select
                value={urgency}
                onChange={(e) => setUrgency(Number(e.target.value))}
                aria-label="Urgency selector"
              >
                <option value={1}>Low Urgency</option>
                <option value={3}>Medium Urgency</option>
                <option value={5}>High Urgency</option>
              </select>
              <button onClick={addTask} aria-label="Add task">Add Task</button>
              {tasks.length > 0 && (
                <div>
                  <button onClick={clearAll} aria-label="Clear all tasks">Clear All</button>
                  <button onClick={exportTasks} aria-label="Export tasks">Export Tasks</button>
                </div>
              )}
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                aria-label="Sort tasks by"
              >
                <option value="priority">Sort by Priority</option>
                <option value="time">Sort by Time</option>
                <option value="category">Sort by Category</option>
              </select>
            </div>
            {error && <div className="error">{error}</div>}
            <div className="task-list">
              {sortedTasks.map(task => (
                <div key={task.id} className={`task-card ${task.completed ? 'completed' : ''}`}>
                  <div className="task-info">
                    <span>{task.name}</span>
                    <small>
                      Priority: {task.priority} | Time: {task.time} | Est. {task.estimatedTime} | Cat: {task.category}{task.isAutoCategorized ? ' (Auto)' : ''}
                    </small>
                  </div>
                  <div className="task-actions">
                    <button onClick={() => toggleComplete(task.id)} aria-label={task.completed ? 'Undo completion' : 'Mark as complete'}>
                      {task.completed ? 'Undo' : 'Complete'}
                    </button>
                    <button onClick={() => deleteTask(task.id)} aria-label="Delete task">Delete</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TaskFlowApp />);
  </script>
</body>
</html>
